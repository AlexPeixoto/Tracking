[project]
name = "tracking"
version = "0.1.0"
description = "Desktop library browser for anime, movies and games spread across drives"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "guessit>=3.8",
    "pymediainfo>=6.1",
    "howlongtobeatpy>=1.0.5",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.gui-scripts]
tracking = "tracking.__main__:main"

[tool.setuptools.packages.find]
include = ["tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tracking"]
omit = ["tracking/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
sort = "Cover"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist", "packaging"]

[tool.ruff.lint]
# pyflakes + pycodestyle, import order, likely bugs, simpler / modern Python.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # small lambdas assigned to names are fine here
    "SIM105",  # try/except/pass reads clearer than contextlib.suppress in this code
    "RUF001", "RUF002", "RUF003",  # "…", "×", "·" and dashes are deliberate in UI text
    "B008",    # Qt default arguments like QModelIndex()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal file names are the test data

[tool.ruff.lint.isort]
known-first-party = ["tracking"]
