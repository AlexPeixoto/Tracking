[project]
name = "tracking"
version = "0.1.0"
description = "Desktop library browser for anime, movies and games spread across drives"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "guessit>=3.8",
    "pymediainfo>=6.1",
    "howlongtobeatpy>=1.0.5",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
tracking = "tracking.__main__:main"

[tool.setuptools.packages.find]
include = ["tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
